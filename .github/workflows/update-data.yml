name: Mise à jour mensuelle des données

on:
  schedule:
    # Le 1er de chaque mois à 4 h UTC, soit 8 h à La Réunion (UTC+4).
    # Attention : GitHub exprime toujours cron en UTC, sans exception.
    - cron: '0 4 1 * *'
  # Permet de lancer la mise à jour à la main depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  mettre-a-jour:
    name: Régénérer results.json depuis OpenPowerlifting
    runs-on: ubuntu-latest

    # `contents` : sans elle, le workflow lit le dépôt mais ne peut pas y écrire,
    # et le commit final échouerait.
    #
    # `actions` : nécessaire pour déclencher le déploiement à la fin. Voir la
    # dernière étape, qui explique pourquoi il ne part pas tout seul.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Télécharge ~168 Mo, lit 4 millions de lignes en flux, écrit
      # src/data/results.json et data/meets-candidates.json.
      - name: Régénérer les données
        run: npm run data:update

      - name: Commiter uniquement s'il y a du changement
        id: maj
        run: |
          FICHIERS="src/data/results.json data/meets-candidates.json"

          # Le script étant idempotent, un dump inchangé produit des fichiers
          # rigoureusement identiques. Sans ce test, on créerait un commit vide
          # chaque mois — et donc un déploiement inutile.
          if git diff --quiet -- $FICHIERS; then
            echo "Données inchangées : aucun commit."
            echo "change=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FICHIERS
          git commit -m "données : mise à jour mensuelle depuis OpenPowerlifting"
          git push

          echo "change=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # LE DÉPLOIEMENT NE PART PAS TOUT SEUL, ET C'EST VOULU PAR GITHUB.
      #
      # Un push effectué avec le jeton par défaut `GITHUB_TOKEN` NE DÉCLENCHE
      # AUCUN autre workflow. La règle existe pour empêcher les boucles infinies
      # entre workflows qui se poussent l'un l'autre.
      #
      # Conséquence mesurée le 10 septembre 2026 : la mise à jour du 1er
      # septembre avait bien été commitée, avec 86 résultats et 45 athlètes de
      # plus, mais le site en ligne affichait toujours les données de mars. Rien
      # ne le signalait : le workflow était au vert, le commit était là, et
      # personne ne regardait la date en pied de page.
      #
      # On déclenche donc le déploiement explicitement. `workflow_dispatch` est
      # déjà déclaré dans deploy.yml, et la permission `actions: write` suffit :
      # aucun jeton personnel à créer ni à faire tourner.
      # -----------------------------------------------------------------------
      - name: Déclencher le déploiement
        if: steps.maj.outputs.change == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          echo "Déploiement demandé sur ${{ github.ref_name }}."

      - name: Signaler les compétitions à trier
        run: |
          # meets-candidates.json liste les compétitions organisées dans une
          # commune réunionnaise que la règle du nom ne reconnaît pas. Elles ne
          # sont PAS publiées tant qu'un humain ne les a pas validées : ce
          # résumé sert à ne pas les oublier.
          node -e "
            const fs = require('node:fs');
            const f = 'data/meets-candidates.json';
            if (!fs.existsSync(f)) process.exit(0);
            const { meets = [] } = JSON.parse(fs.readFileSync(f, 'utf8'));
            if (meets.length === 0) {
              console.log('Aucune compétition en attente de tri.');
              process.exit(0);
            }
            console.log(meets.length + ' compétition(s) à vérifier à la main :');
            for (const m of meets) console.log('  ' + m.date + '  ' + m.meetTown + ', ' + m.meetName);
          " >> $GITHUB_STEP_SUMMARY
