name: Construire et déployer sur OVH

# Se déclenche à chaque envoi sur main — y compris celui que produit
# automatiquement le workflow de mise à jour des données.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois. Sans ça, deux envois rapprochés pourraient
# téléverser leurs fichiers en même temps et laisser le site dans un état
# incohérent.
concurrency:
  group: deploiement-ovh
  cancel-in-progress: true

jobs:
  deployer:
    name: Build Astro puis dépôt SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installe exactement les versions du package-lock.json, sans
      # jamais les mettre à jour. C'est ce qui garantit que le site construit
      # ici est identique à celui construit sur ta machine.
      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Ces deux variables ne servent qu'à la partie communauté.
          # La clé « anon » est publique par conception : elle est destinée à
          # partir dans le JavaScript du navigateur. Ce n'est pas elle qui
          # protège les données, ce sont les politiques RLS côté Supabase.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      # ---------------------------------------------------------------------
      # Dépôt par SFTP (SSH), et non par FTPS.
      #
      # L'hébergement mutualisé OVH n'implémente pas le FTPS : le serveur
      # répond « 500 This security scheme is not implemented » à la commande
      # AUTH TLS. Le SSH, lui, est bien disponible sur le même hôte, port 22.
      #
      # On utilise rsync plutôt qu'un outil SFTP classique pour deux raisons :
      # il transfère uniquement les fichiers réellement modifiés, et surtout il
      # gère les fichiers commençant par un point. Beaucoup d'outils les
      # ignorent silencieusement — or `.htaccess` porte la redirection HTTPS,
      # la page 404 et les en-têtes de cache. Le site fonctionnerait « presque »,
      # ce qui est la pire des situations à diagnostiquer.
      # ---------------------------------------------------------------------
      - name: Installer rsync et sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync sshpass

      - name: Repérer le dossier cible sur le serveur
        id: cible
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          SSH_OPTS="-p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # On regarde d'abord OÙ l'on atterrit. Selon que le compte est
          # cloisonné ou non, le dossier de connexion est soit le dossier du
          # site lui-même, soit la racine de l'hébergement qui le contient.
          LISTING=$(sshpass -p "$SSH_PASS" ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
                    'echo "PWD=$(pwd)"; ls -A' 2>&1) || {
            echo "Connexion SSH impossible." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$LISTING" | tail -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if printf '%s' "$LISTING" | grep -qx 'sbd-re'; then
            # Compte non cloisonné : le dossier du site est un sous-dossier.
            CIBLE="./sbd-re"
          else
            # Compte cloisonné : on est déjà dans le dossier du site.
            CIBLE="."
          fi
          echo "cible=$CIBLE" >> "$GITHUB_OUTPUT"

          {
            echo "## Dossier cible"
            echo ""
            echo "Destination retenue : \`$CIBLE\`"
            echo ""
            echo "<details><summary>Contenu du dossier de connexion</summary>"
            echo ""
            echo '```'
            echo "$LISTING"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer le site
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
          CIBLE: ${{ steps.cible.outputs.cible }}
        run: |
          set -u
          # Volontairement SANS --delete tant que la destination n'est pas
          # confirmée par un premier déploiement réussi : une erreur de chemin
          # combinée à --delete effacerait l'hébergement.
          sshpass -p "$SSH_PASS" rsync -rlptz --human-readable --stats \
            -e "ssh -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" \
            ./dist/ "$SSH_USER@$SSH_HOST:$CIBLE/"

      - name: Vérifier ce qui est arrivé
        if: always()
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
          CIBLE: ${{ steps.cible.outputs.cible }}
        run: |
          set -u
          SSH_OPTS="-p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          VERIF=$(sshpass -p "$SSH_PASS" ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "cd '$CIBLE' 2>/dev/null && echo \"PWD=\$(pwd)\" && \
             echo \"index.html : \$( [ -f index.html ] && echo present || echo ABSENT )\" && \
             echo \".htaccess  : \$( [ -f .htaccess ] && echo present || echo ABSENT )\" && \
             echo \"fichiers   : \$(find . -type f | wc -l)\" && \
             echo \"pages ath. : \$(find ./athlete -maxdepth 1 -type d 2>/dev/null | wc -l)\"" 2>&1) || true
          {
            echo "## Vérification après dépôt"
            echo ""
            echo '```'
            echo "$VERIF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
