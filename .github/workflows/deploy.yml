name: Construire et déployer sur OVH

# Se déclenche à chaque envoi sur main — y compris celui que produit
# automatiquement le workflow de mise à jour des données.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois. Sans ça, deux envois rapprochés pourraient
# téléverser leurs fichiers en même temps et laisser le site dans un état
# incohérent.
concurrency:
  group: deploiement-ovh
  cancel-in-progress: true

jobs:
  deployer:
    name: Build Astro puis dépôt FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installe exactement les versions du package-lock.json, sans
      # jamais les mettre à jour. C'est ce qui garantit que le site construit
      # ici est identique à celui construit sur ta machine.
      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Ces deux variables ne servent qu'à la partie communauté.
          # La clé « anon » est publique par conception : elle est destinée à
          # partir dans le JavaScript du navigateur. Ce n'est pas elle qui
          # protège les données, ce sont les politiques RLS côté Supabase.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      # Étape de diagnostic. Le journal détaillé d'une exécution n'est lisible que
      # par un administrateur du dépôt ; le RÉSUMÉ de job, lui, est public. On y
      # écrit donc l'essentiel pour pouvoir comprendre un échec de connexion sans
      # avoir à ouvrir l'interface GitHub.
      #
      # `continue-on-error` : ce test ne doit jamais faire échouer le
      # déploiement, il ne fait qu'observer.
      - name: Diagnostic de la connexion FTPS
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "## Diagnostic de la connexion FTPS"
            echo ""
            # On vérifie la PRÉSENCE des secrets, jamais leur contenu : ce résumé
            # est public.
            for cle in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
              if [ -z "${!cle}" ]; then
                echo "- \`$cle\` : **absent ou vide**"
              else
                echo "- \`$cle\` : renseigné"
              fi
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Simple listing de la racine, avec le même protocole que le
          # déploiement : FTPS explicite sur le port 21.
          SORTIE=$(curl --silent --show-error --ssl-reqd --list-only \
                        --connect-timeout 20 --max-time 60 \
                        --user "$FTP_USERNAME:$FTP_PASSWORD" \
                        "ftp://$FTP_SERVER/" 2>&1)
          CODE=$?

          {
            echo "### Listing de la racine FTP"
            echo ""
            echo "Code de sortie curl : \`$CODE\` ($( [ $CODE -eq 0 ] && echo 'succès' || echo 'échec' ))"
            echo ""
            echo '```'
            echo "$SORTIE" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer sur OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS et jamais FTP simple : en FTP, identifiant et mot de passe
          # transitent en clair sur le réseau.
          protocol: ftps
          local-dir: ./dist/
          # L'utilisateur FTP est restreint (« chrooté ») au dossier du site :
          # la racine qu'il voit EST ce dossier. On dépose donc à la racine, et
          # surtout pas dans un sous-dossier `www/`, qui créerait un niveau
          # d'imbrication de trop sans provoquer la moindre erreur.
          server-dir: ./
          # L'action garde un état de synchronisation sur le serveur et ne
          # renvoie que les fichiers réellement modifiés.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
